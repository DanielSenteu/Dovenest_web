<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../images/dove_logo.png">
  <link rel="apple-touch-icon" href="../images/dove_logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — DoveNest Insurance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #04111f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    /* background grid pattern */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(82,180,75,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(82,180,75,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .card {
      background: #0d2137;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }
    .card-top {
      padding: 32px 36px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .logo-row img {
      height: 32px;
      filter: brightness(0) invert(1);
      opacity: 0.9;
    }
    .admin-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #52B44B;
      background: rgba(82,180,75,0.12);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(82,180,75,0.25);
    }
    .card-top h1 {
      color: #fff;
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .card-top p {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.45);
    }
    .card-body { padding: 28px 36px 32px; }

    /* Steps */
    .step { display: none; }
    .step.active { display: block; }

    /* Form elements */
    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
      margin-bottom: 7px;
      letter-spacing: 0.02em;
    }
    .field input {
      width: 100%;
      padding: 0.72rem 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 9px;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input::placeholder { color: rgba(255,255,255,0.25); }
    .field input:focus {
      border-color: #52B44B;
      box-shadow: 0 0 0 3px rgba(82,180,75,0.12);
    }

    /* MFA code input */
    .mfa-input {
      text-align: center;
      font-size: 1.6rem !important;
      font-weight: 700 !important;
      letter-spacing: 0.3em !important;
      padding: 0.9rem 1rem !important;
    }
    .mfa-hint {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.4);
      text-align: center;
      margin-top: 8px;
    }

    /* Submit button */
    .btn {
      width: 100%;
      padding: 0.88rem;
      background: #52B44B;
      color: #0d2137;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }
    .btn:hover:not(:disabled) { background: #d4911a; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #0d2137;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .btn.loading .spinner { display: block; }
    .btn.loading .btn-label { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error-box {
      display: none;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.8rem;
      color: #fca5a5;
      margin-bottom: 16px;
    }
    .error-box.show { display: block; }

    /* Step indicator */
    .step-indicator {
      display: flex;
      gap: 6px;
      margin-bottom: 22px;
    }
    .step-dot {
      height: 3px;
      border-radius: 2px;
      flex: 1;
      background: rgba(255,255,255,0.1);
      transition: background 0.3s;
    }
    .step-dot.done { background: #52B44B; }

    .step-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 20px;
    }
    .step-title span { color: #52B44B; }

    .link-row {
      margin-top: 20px;
      text-align: center;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.35);
    }
    .link-row a { color: #52B44B; text-decoration: none; font-weight: 600; }
    .link-row a:hover { color: #d4911a; }

    .back-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.4);
      font-family: 'Poppins', sans-serif;
      font-size: 0.78rem;
      cursor: pointer;
      padding: 0;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.2s;
    }
    .back-btn:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-top">
      <div class="logo-row">
        <img src="../images/dovenest-logo.png" alt="DoveNest">
        <span class="admin-badge">Admin</span>
      </div>
      <h1>Welcome back</h1>
      <p>Sign in to the DoveNest admin panel</p>
    </div>

    <div class="card-body">
      <div class="error-box" id="errorBox"></div>

      <!-- STEP 1: Email + Password -->
      <div class="step active" id="step1">
        <div class="step-indicator">
          <div class="step-dot done" id="dot1"></div>
          <div class="step-dot" id="dot2"></div>
        </div>
        <p class="step-title"><span>Step 1</span> — Your Email</p>

        <div class="field">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="you@dovenest.com" autocomplete="email">
        </div>

        <button class="btn" id="btnSend" onclick="handleSendCode()">
          <span class="spinner"></span>
          <span class="btn-label">Email me a code →</span>
        </button>

        <div class="link-row">
          Don't have an account? <a href="signup.html">Sign up</a>
        </div>
      </div>

      <!-- STEP 2: MFA Code -->
      <div class="step" id="step2">
        <div class="step-indicator">
          <div class="step-dot done"></div>
          <div class="step-dot done"></div>
        </div>
        <button class="back-btn" onclick="goBack()">← Back</button>
        <p class="step-title"><span>Step 2</span> — Enter Code</p>

        <div class="field">
          <label>Email Code</label>
          <input type="text" id="otpCode" class="mfa-input" placeholder="000000"
                 maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code">
          <p class="mfa-hint">We emailed a 6-digit code to <strong id="sentTo"></strong>. It expires in a few minutes.</p>
        </div>

        <button class="btn" id="btnVerify" onclick="handleVerify()">
          <span class="spinner"></span>
          <span class="btn-label">Verify & Sign In</span>
        </button>

        <div class="link-row">
          Didn't get it? <a href="#" onclick="resendCode(event)">Resend code</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  const sb = window.supabase.createClient(
    'https://tbokejycxpaefpccynbh.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRib2tlanljeHBhZWZwY2N5bmJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MTUzNzYsImV4cCI6MjA5MzE5MTM3Nn0.OlP4LaptamkDbQ9MgJGv1NIEO2KfobWW0k-X6ensYEw'
  );

  let pendingEmail = null;
  let verifying    = false;  // re-entrancy guard: auto-submit + Enter/click can double-fire

  // If already signed in as an allowlisted admin, skip straight to the dashboard.
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return;
    const email = (session.user.email || '').toLowerCase();
    const { data: adminRow } = await sb.from('admin_invites').select('email').eq('email', email).maybeSingle();
    if (adminRow) window.location.replace('dashboard.html');
  })();

  function showError(msg) {
    const box = document.getElementById('errorBox');
    box.textContent = msg;
    box.classList.add('show');
  }
  function clearError() {
    document.getElementById('errorBox').classList.remove('show');
  }
  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    btn.classList.toggle('loading', loading);
    btn.disabled = loading;
  }
  function goBack() {
    clearError();
    document.getElementById('step2').classList.remove('active');
    document.getElementById('step1').classList.add('active');
  }

  // Allow Enter key to submit
  document.getElementById('loginEmail').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleSendCode();
  });
  document.getElementById('otpCode').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleVerify();
  });
  // Auto-submit when 6 digits entered
  document.getElementById('otpCode').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
    if (e.target.value.length === 6) handleVerify();
  });

  async function handleSendCode() {
    clearError();
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    if (!email) { showError('Please enter your email address.'); return; }

    setLoading('btnSend', true);
    // shouldCreateUser:false → only existing admin accounts can request a code.
    const { error } = await sb.auth.signInWithOtp({ email, shouldCreateUser: false });
    setLoading('btnSend', false);

    if (error) {
      showError(error.message || 'Could not send a code. Please try again.');
      return;
    }

    pendingEmail = email;
    document.getElementById('sentTo').textContent = email;
    document.getElementById('step1').classList.remove('active');
    document.getElementById('step2').classList.add('active');
    setTimeout(() => document.getElementById('otpCode').focus(), 100);
  }

  async function resendCode(ev) {
    if (ev) ev.preventDefault();
    if (!pendingEmail) return;
    clearError();
    const { error } = await sb.auth.signInWithOtp({ email: pendingEmail, shouldCreateUser: false });
    if (error) { showError(error.message || 'Could not resend the code.'); return; }
    showError('A new code is on its way to your inbox.');
  }

  async function handleVerify() {
    if (verifying) return;          // ignore the second of a double-fire
    clearError();
    const code = document.getElementById('otpCode').value.trim();
    if (code.length !== 6) { showError('Please enter the 6-digit code from your email.'); return; }

    verifying = true;
    setLoading('btnVerify', true);
    const { error } = await sb.auth.verifyOtp({ email: pendingEmail, token: code, type: 'email' });
    if (error) {
      verifying = false;
      setLoading('btnVerify', false);
      // Surface the real reason while we debug (e.g. otp_expired / invalid).
      showError((error.message || 'Invalid or expired code.') + ' [' + (error.status || '?') + ']');
      const el = document.getElementById('otpCode'); el.value = ''; el.focus();
      return;
    }

    // Defense in depth: confirm this email is on the admin allowlist before entering.
    const { data: adminRow } = await sb.from('admin_invites').select('email').eq('email', pendingEmail).maybeSingle();
    if (!adminRow) {
      await sb.auth.signOut();
      setLoading('btnVerify', false);
      showError('This account is not authorised for admin access.');
      return;
    }

    window.location.replace('dashboard.html');
  }
  </script>
</body>
</html>
